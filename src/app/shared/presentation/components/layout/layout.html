<mat-toolbar class="toolbar" role="banner">
  <button mat-icon-button (click)="toggleMenu()" [attr.aria-label]="'toolbar.toggle-menu' | translate">
    <mat-icon>menu</mat-icon>
  </button>
  <img [src]="logoPath" class="logo" [alt]="'toolbar.logo-alt' | translate">
  <span class="title">{{ 'toolbar.title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="layout-container">
  <mat-sidenav [mode]="isHandset() ? 'over' : 'side'" [opened]="opened()" (closed)="opened.set(false)"
               class="sidenav" role="navigation" [attr.aria-label]="'menu.navigation' | translate">
    <mat-nav-list>
      @for (option of options; track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" ariaCurrentWhenActive="page">
          <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
          <span matListItemTitle>{{ option.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="page-content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
